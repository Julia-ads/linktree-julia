<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header>
        <!-- Div container controla a largura max dos elementos-->
        <div class="container">
            <!-- Início Avatar -->
            <div class="avatar">
                <figure>
                    <img src="assets/imagem.png" alt="Imagem_Julia">
                </figure>
            </div>
            <!-- Fim do Avatar -->
            <div>
                <h1>@juliacidade29</h1>
            </div>

            <div>
                <p>Descubra mais sobre o meu trabalho e onde pode me encontrar</p>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="links">
                <a href="#" class="website">Website</a>
                <a href="#" class="whatsapp">WhatsApp</a>
                <a href="#" class="github">GitHub</a>
                <a href="#" class="linkedin">LinkedIn</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Made in Cariri</p>
        </div>
    </footer>

</body>
</html>
